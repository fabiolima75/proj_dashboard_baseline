<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Baseline de Parâmetros – Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{--claro:#ED1C24;--ink:#111;--muted:#6b7280;--card:#fff;--bg:#fafafa;--col-max:280px}
  *{box-sizing:border-box}
  html, body { max-width:100%; overflow-x:hidden; }
  body{margin:0;font-family:'Roboto',system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}

  /* Login gate */
  html.auth-lock body > *:not(#auth-gate) { display: none !important; }
  #auth-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;z-index:99999}
  #auth-gate .box{background:#111827;padding:24px;border-radius:12px;width:min(92vw,360px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #auth-gate h2{margin:0 0 6px 0;font-size:18px}
  #auth-gate .sub{opacity:.8;font-size:13px;margin-bottom:10px}
  #auth-gate label{display:block;font-size:13px;margin:10px 0 6px}
  #auth-gate input[type="text"],#auth-gate input[type="password"]{width:100%;padding:10px;border-radius:8px;border:1px solid #374151;background:#0b0f19;color:#fff;}
  #auth-gate .row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;opacity:.9}
  #auth-gate button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:#ED1C24;color:#fff;font-weight:700;cursor:pointer}
  #auth-error{color:#fca5a5;font-size:12px;height:16px;margin-top:6px}

  /* Header */
  header{
    position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#ED1C24,#B31217);
    color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;overflow:hidden;
  }
  header h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
  .last-update{font-size:12px;opacity:.85;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;white-space:nowrap}
  .spacer{flex:1 1 auto;min-width:8px}
  .actions{display:flex;align-items:center;gap:8px;flex:0 1 auto;white-space:nowrap;flex-wrap:nowrap;transform-origin:right center}
  .btn{border:0;border-radius:999px;cursor:pointer;background:#fff;color:#B31217;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:clamp(10px,.95vw,14px);padding:clamp(6px,.7vw,9px) clamp(10px,.9vw,12px);line-height:1}
  .btn.secondary{background:#fff5f6;color:#7a0b0f}
  input[type=file]{display:none}

  /* Body */
  .container{max-width:1500px;margin:0 auto;padding:14px}
  .panel{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
  .section-title{font-weight:900;margin:6px 0 10px 6px}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
  .kpi{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .kpi .label{font-size:11px;color:var(--muted)}
  .kpi .value{font-size:20px;font-weight:900}

  /* Filters */
  .filters{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .filters .field label{display:block;font-weight:700;margin-bottom:6px;color:#111}
  .filters select,.filters input[type=search]{padding:10px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;width:100%}

  /* Charts grid */
  .grid{display:grid;gap:14px}
  .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chart{height:360px;width:100%}
  /* Pie maior */
  #chTech.chart{height:440px}

  /* Toast */
  .toast{position:fixed;right:16px;bottom:16px;background:#fff;border-left:6px solid var(--claro);padding:10px 12px;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.18);display:none;z-index:20}

  /* Loading overlay */
  #loading {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.66);
    color: #fff; display: none;
    align-items: center; justify-content: center;
    z-index: 9999;
  }
  #loading .box {
    background: rgba(17,24,39,.95);
    padding: 18px 20px; border-radius: 12px;
    min-width: 260px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .spinner {
    width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.25);
    border-top-color: #fff; border-radius: 50%;
    margin: 0 auto 10px auto; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg);} }
  .progress {
    height: 6px; background: #0b1220; border-radius: 999px; overflow: hidden; margin-top: 8px;
  }
  .progress > div { height: 100%; width: 0%; background: linear-gradient(90deg,#ff8a90,#ED1C24); transition: width .2s ease; }

  /* Table */
  .table-wrap{width:100%;max-height:60vh;overflow:auto;overflow-x:scroll;border:1px solid #eee;border-radius:12px;background:#fff}
  table.simple{width:max(1200px,100%);border-collapse:separate;border-spacing:0;table-layout:auto}
  table.simple th,table.simple td{border-bottom:1px solid #eee;padding:10px 12px;text-align:left;white-space:nowrap;font-size:13px}
  /* Delimitação visível entre colunas no cabeçalho */
  table.simple th { position:sticky; top:0; background:#f1f5f9; font-weight:900; color:#0f172a; border-bottom:2px solid #e5e7eb; box-shadow:0 2px 0 rgba(0,0,0,.06); border-right:1px solid #e2e8f0; }
  table.simple th:last-child { border-right:none; }

  td .clip, th .clip {display:inline-block; max-width:var(--col-max); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:top;}

  /* Handles de resize no cabeçalho */
  th { position: relative; }
  .col-resizer{
    position:absolute; top:0; right:-3px; width:6px; height:100%;
    cursor:col-resize; user-select:none;
  }
  .col-resizer::after{
    content:""; position:absolute; top:0; bottom:0; left:2px; width:2px; background:#cbd5e1; opacity:.8;
  }

  /* Tooltip da tabela */
  #tooltip {
    position: fixed;
    background: #111827;
    color: #fff;
    padding: 8px 10px;
    border-radius: 8px;
    box-shadow: 0 10px 20px rgba(0,0,0,.25);
    white-space: pre-wrap;
    max-width: 600px;
    z-index: 2000;
    pointer-events: none;
    display: none;
    transition: opacity 0.2s ease-in-out;
    opacity: 0;
    font-size: 12px; 
  }
</style>

</head>

<script>
/* ===== Autenticação ===== */
(function(){
  var USERNAME="performance", PASSWORD="nps70", LS_KEY="dash_auth_ok_v1";
  if(localStorage.getItem(LS_KEY)!=="1"){
    document.documentElement.classList.add('auth-lock');
    window.addEventListener('DOMContentLoaded',function(){
      var gate=document.createElement('div'); gate.id="auth-gate";
      gate.innerHTML =
        '<div class="box">'+
          '<h2>Acesso restrito</h2>'+
          '<div class="sub">Informe usuário e senha</div>'+
          '<label>Usuário</label><input id="auth-user" type="text" autocomplete="username" />'+
          '<label>Senha</label><input id="auth-pass" type="password" autocomplete="current-password" />'+
          '<div id="auth-error"></div>'+
          '<div class="row"><input id="auth-remember" type="checkbox"/><label for="auth-remember" style="margin:0;cursor:pointer">Lembrar neste navegador</label></div>'+
          '<button id="auth-go" type="button">Entrar</button>'+
        '</div>';
      document.body.prepend(gate);
      var go=function(){
        var u=(document.getElementById('auth-user').value||"").trim();
        var p=(document.getElementById('auth-pass').value||"");
        if(u===USERNAME && p===PASSWORD){
          if(document.getElementById('auth-remember').checked) localStorage.setItem(LS_KEY,"1");
          gate.remove(); document.documentElement.classList.remove('auth-lock');
          requestAnimationFrame(function(){window.dispatchEvent(new Event('resize'));});
        }else document.getElementById('auth-error').textContent="Usuário ou senha inválidos";
      };
      document.getElementById('auth-go').onclick=go;
      document.getElementById('auth-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
    });
  }
})();
</script>

<header>
  <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="g" cx="35%" cy="35%" r="80%"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="40%" stop-color="#ff5a5f"/><stop offset="100%" stop-color="#ED1C24"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="url(#g)"/><text x="50" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#fff" font-family="Arial, Helvetica, sans-serif">Claro</text><line x1="76" y1="30" x2="92" y2="30" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>

<script>
/* ===== Estado/Constantes ===== */
var ORDER = ["REF","MO & Paramater","VENDOR","TECHNOLOGY","SW VERSION","MO","PARAMETER","FREQUENCY","PROFILE","OPERATOR","RANGE","PARAMETER CLASS","COMMENT","SPRINT","FEATURE","FUNÇÃO"];
var HIDDEN_COLS = ["REF","MO & Paramater"];
var RAW=[], VIEW=[], COLS = ORDER.filter(function(c){return HIDDEN_COLS.indexOf(c)===-1;});
var FILTERS={vendor:[],tech:[],cls:[],sprint:[],func:[],search:''};

/* ===== Utils ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function ci(s){return String(s||'').toLowerCase();}
function toast(m){
  try{
    var t=document.getElementById('toast');
    t.textContent=m;
    t.style.display='block';
    clearTimeout(t._t);
    t._t=setTimeout(function(){ t.style.display='none'; }, 2200);
  }catch(e){}
}
function friendly(v){v=(v==null?'':String(v)).trim();return v===''?null:v;}
function uniqSorted(values){var s=new Set();values.forEach(function(x){if(x!=null && String(x)!=='') s.add(String(x));});return Array.from(s).sort();}
function groupCount(arr,keyFn){var m={};arr.forEach(function(r){var k=keyFn(r)||'N/D';m[k]=(m[k]||0)+1;});return Object.entries(m).sort(function(a,b){return b[1]-a[1];});}

/* ===== Loading Overlay helpers ===== */
var $loading = null, $msg = null, $bar = null, _indTimer = null;
function initLoading(){
  if($loading) return;
  $loading = document.getElementById('loading');
  $msg = document.getElementById('loading-msg');
  $bar = document.getElementById('loading-bar');
}
function showLoading(msg){
  initLoading();
  if($loading){ $loading.style.display='flex'; }
  setLoading(msg||'Carregando…', 10);
  // animação indeterminada leve
  clearInterval(_indTimer);
  _indTimer = setInterval(function(){
    if(!$bar) return;
    var w = parseFloat($bar.style.width||'0');
    w = (w>=90)? 20 : (w + 8);
    $bar.style.width = w + '%';
  }, 300);
}
function setLoading(msg, pct){
  if($msg && msg!=null) $msg.textContent = msg;
  if($bar && typeof pct==='number') $bar.style.width = Math.max(0,Math.min(100,pct)) + '%';
}
function hideLoading(){
  clearInterval(_indTimer);
  if($loading){ $loading.style.display='none'; }
  if($bar){ $bar.style.width='0%'; }
}

/* ===== Normalização ===== */
function normalizeColumns(rows){
  rows.forEach(function(r){
    if('COMENTÁRIOS' in r){ r['COMMENT']=r['COMENTÁRIOS']; delete r['COMENTÁRIOS']; }
    if('COMENTARIOS' in r){ r['COMMENT']=r['COMENTARIOS']; delete r['COMENTARIOS']; }
    Object.keys(r).forEach(function(k){ if(ORDER.indexOf(k)===-1) delete r[k]; });
    ORDER.forEach(function(k){ if(!(k in r)) r[k]=''; });
    if(r['VENDOR']) r['VENDOR']=String(r['VENDOR']).toUpperCase();
    if(r['PARAMETER CLASS']) r['PARAMETER CLASS']=String(r['PARAMETER CLASS']).toUpperCase();
    if(r['SPRINT']) r['SPRINT']=String(r['SPRINT']).toUpperCase();
  });
}

/* ===== Filtros ===== */
function onFilterChanged(){
  var fVendor=document.getElementById('fVendor');
  var fTech=document.getElementById('fTech');
  var fClass=document.getElementById('fClass');
  var fSprint=document.getElementById('fSprint');
  var fFunc=document.getElementById('fFunc');
  var fSearch=document.getElementById('fSearch');

  FILTERS.vendor=[].slice.call((fVendor&&fVendor.selectedOptions)||[]).map(function(o){return o.value;});
  FILTERS.tech=[].slice.call((fTech&&fTech.selectedOptions)||[]).map(function(o){return o.value;});
  FILTERS.cls=[].slice.call((fClass&&fClass.selectedOptions)||[]).map(function(o){return o.value;});
  FILTERS.sprint=[].slice.call((fSprint&&fSprint.selectedOptions)||[]).map(function(o){return o.value;});
  FILTERS.func=[].slice.call((fFunc&&fFunc.selectedOptions)||[]).map(function(o){return o.value;});
  FILTERS.search=ci((fSearch && fSearch.value)||'');

  renderAll();
}
function fillSelect(id, values){
  var el=document.getElementById(id); if(!el) return;
  el.innerHTML='';
  var arr=uniqSorted(values);
  arr.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); });
}
function ensureFilterBindings(){
  ['fVendor','fTech','fClass','fSprint','fFunc'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.onchange = onFilterChanged;
  });
  var fSearch=document.getElementById('fSearch');
  if(fSearch) fSearch.oninput = onFilterChanged;
  var btnClear=document.getElementById('btnClear');
  if(btnClear) btnClear.onclick = resetFilters;
}

/* ===== Importação (FileReader com feedback) ===== */
document.getElementById('fileInput').addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;

  const name = file.name || '';
  const ext  = (name.split('.').pop() || '').toLowerCase();
  const isCSV = ext === 'csv';
  const reader = new FileReader();

  showLoading('Lendo arquivo…');

  // Progresso real apenas em readAsText; para binário deixamos indeterminado
  reader.onprogress = function(evt){
    if(evt && evt.lengthComputable){
      var pct = Math.round((evt.loaded/evt.total)*70); // até 70% na leitura
      setLoading('Lendo arquivo…', pct);
    }
  };

  reader.onerror = function(err){
    console.error('FileReader error:', err);
    hideLoading();
    toast('Falha ao ler o arquivo.');
    e.target.value='';
  };

  reader.onloadstart = function(){ setLoading('Lendo arquivo…', 10); };
  reader.onloadend = function(){ setLoading('Processando planilha…', 75); };

  reader.onload = function(evt){
    try{
      let rows = [];

      if(isCSV){
        const text = evt.target.result;
        setLoading('Interpretando CSV…', 80);
        const wb = XLSX.read(text, { type: 'string' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      }else{
        const data = evt.target.result; // ArrayBuffer
        setLoading('Interpretando Excel…', 80);
        const wb = XLSX.read(new Uint8Array(data), { type: 'array' });
        const sheetName = (wb.SheetNames || []).find(function(sn){
          const arr = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: "" });
          return arr && arr.length;
        }) || wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      }

      if(!rows || !rows.length){
        hideLoading();
        toast('Planilha vazia ou colunas não reconhecidas.');
        return;
      }

      setLoading('Normalizando dados…', 85);
      RAW = rows.map(function(r){
        var o={}; ORDER.forEach(function(c){ o[c]=r[c]||''; }); return o;
      });
      normalizeColumns(RAW);

      setLoading('Preparando filtros…', 90);
      buildFilters();
      ensureFilterBindings();

      setLoading('Renderizando gráficos…', 95);
      renderAll();

      hideLoading();
      toast('Arquivo carregado.');
    }catch(err){
      console.error('Erro ao processar planilha:', err);
      hideLoading();
      toast('Falha ao processar a planilha.');
    }finally{
      e.target.value='';
    }
  };

  if(isCSV) reader.readAsText(file, 'utf-8');
  else reader.readAsArrayBuffer(file);
});

/* ===== Exportações ===== */
document.getElementById('btnXLSX').addEventListener('click', function(){
  if(!RAW.length){ toast('Sem dados para exportar.'); return; }
  var out=(VIEW.length?VIEW:RAW).map(function(r){var o={}; ORDER.forEach(function(k){o[k]=r[k]||'';}); return o;});
  var ws=XLSX.utils.json_to_sheet(out,{header:ORDER});
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Dados');
  XLSX.writeFile(wb,(prompt('Nome do arquivo Excel:','Baseline_filtrado')||'Baseline_filtrado')+'.xlsx');
});
document.getElementById('btnCSV').addEventListener('click', function(){
  if(!RAW.length){ toast('Sem dados para exportar.'); return; }
  var out=(VIEW.length?VIEW:RAW).map(function(r){var o={}; ORDER.forEach(function(k){o[k]=r[k]||'';}); return o;});
  var header=ORDER.join(';');
  var body=out.map(function(r){return ORDER.map(function(k){return String(r[k]).replace(/;/g,',');}).join(';');}).join('\n');
  var csv=header+'\n'+body;
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=(prompt('Nome do arquivo CSV:','Baseline_filtrado')||'Baseline_filtrado')+'.csv'; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href);},100);
});

/* ====== plotGuard (margens compactas + responsivo) ====== */
function plotGuard(elOrId, data, layout, config){
  var el = (typeof elOrId==='string')?document.getElementById(elOrId):elOrId;
  layout = layout || {}; config = config || {};

  var base = {
    margin:{l:50,t:36,b:56,r:16},
    legend:{orientation:'h', y:-0.22, x:0.5, xanchor:'center', bgcolor:'rgba(255,255,255,0.0)', font:{size:11}},
    autosize:true
  };

  var mergedMargin = Object.assign({}, base.margin, (layout.margin||{}));
  var mergedLegend = Object.assign({}, base.legend, (layout.legend||{}));
  var lay = Object.assign({}, base, layout, { margin: mergedMargin, legend: mergedLegend });

  var cfg = Object.assign({responsive:true,displaylogo:false,modeBarButtonsToRemove:['select2d','lasso2d']}, config);

  return Plotly.react(el, data, lay, cfg).then(function(){
    if(!el._rz){
      el._rz=true;
      window.addEventListener('resize', function(){ Plotly.Plots.resize(el); }, {passive:true});
    }
  });
}

/* ===== Render ===== */
function applyFilters(){
  return RAW.filter(function(r){
    var byV = FILTERS.vendor.length ? FILTERS.vendor.indexOf(friendly(r['VENDOR'])||'N/D')>-1 : true;
    var byT = FILTERS.tech.length ? FILTERS.tech.indexOf(friendly(r['TECHNOLOGY'])||'N/D')>-1 : true;
    var byC = FILTERS.cls.length ? FILTERS.cls.indexOf(friendly(r['PARAMETER CLASS'])||'N/D')>-1 : true;
    var byS = FILTERS.sprint.length ? FILTERS.sprint.indexOf(friendly(r['SPRINT'])||'N/D')>-1 : true;
    var byF = FILTERS.func.length ? FILTERS.func.indexOf(friendly(r['FUNÇÃO'])||'N/D')>-1 : true;
    var s = FILTERS.search;
    var bySearch = s ? ['PARAMETER','MO','COMMENT'].some(function(k){ return ci(r[k]).indexOf(s)>-1; }) : true;
    return byV && byT && byC && byS && byF && bySearch;
  });
}

/* ===== Cards ===== */
function renderKPIs(rows){
  var el=document.getElementById('kpis'); el.innerHTML='';
  var total=rows.length;
  var vendors=new Set(rows.map(function(r){return r['VENDOR'];})).size;
  var techs=new Set(rows.map(function(r){return r['TECHNOLOGY'];})).size;
  var byClass=groupCount(rows,function(r){return r['PARAMETER CLASS'];});
  function pick(n){var f=byClass.find(function(x){return x[0]===n;});return f?f[1]:0;}
  function pct(n,d){return d?(Math.round(n/d*1000)/10).toLocaleString('pt-BR')+'%':'0%'}
  var cards = [
    ['Parâmetros', Number(total).toLocaleString('pt-BR')],
    ['Vendors', Number(vendors).toLocaleString('pt-BR')],
    ['Tecnologias', Number(techs).toLocaleString('pt-BR')],
    ['% CATM', pct(pick('CATM'), total)],
    ['% COBERTURA', pct(pick('COBERTURA'), total)],
    ['% DEFAULT', pct(pick('DEFAULT'), total)],
    ['% FEATURE', pct(pick('FEATURE'), total)],
    ['% GOLDEN', pct(pick('GOLDEN'), total)]
  ];
  cards.forEach(function(c){
    var k=document.createElement('div'); k.className='kpi';
    k.innerHTML='<div class="label">'+c[0]+'</div><div class="value">'+c[1]+'</div>';
    el.appendChild(k);
  });
}

/* ===== Gráficos ===== */
function renderVendor(rows){
  var el=document.getElementById('chVendor'); if(!el) return;
  var d=groupCount(rows,function(r){return friendly(r['VENDOR'])||'N/D';});
  var labels=d.map(function(x){return x[0];}), counts=d.map(function(x){return x[1];});
  var tot=counts.reduce(function(a,b){return a+b;},0)||1;

  var perc = counts.map(function(v){return (Math.round(v/tot*1000)/10)+'%';});
  var bar={
    type:'bar',
    orientation:'h',
    y:labels, x:counts, name:'Quantidade',
    text:perc,
    textposition:'auto',
    insidetextanchor:'start',
    textangle:0,
    insidetextorientation:'horizontal',
    hovertemplate:'Vendor=%{y}<br>Qtd=%{x}<br>%=%{text}<extra></extra>',
    cliponaxis:false
  };
  plotGuard(el,[bar],{xaxis:{title:'Qtd',automargin:true},yaxis:{automargin:true},bargap:.12});
}

function renderTech(rows){
  var el=document.getElementById('chTech'); if(!el) return;
  var d=groupCount(rows,function(r){return friendly(r['TECHNOLOGY'])||'N/D';});
  var pie={
    type:'pie',
    labels:d.map(function(x){return x[0];}),
    values:d.map(function(x){return x[1];}),
    textinfo:'label+percent',
    hovertemplate:'%{label}: %{value} (%{percent})<extra></extra>'
  };
  plotGuard(el,[pie],{margin:{t:30,b:20,l:20,r:20}});
}

function renderClassTech(rows){
  var el=document.getElementById('chClassTech'); if(!el) return;
  var techs=[...new Set(rows.map(function(r){return friendly(r['TECHNOLOGY'])||'N/D';}))].sort();
  var classes=[...new Set(rows.map(function(r){return friendly(r['PARAMETER CLASS'])||'N/D';}))].sort();
  var traces=classes.map(function(cls){
    return {type:'bar',name:cls,x:techs,y:techs.map(function(t){var n=0;rows.forEach(function(r){if((friendly(r['TECHNOLOGY'])||'N/D')===t && (friendly(r['PARAMETER CLASS'])||'N/D')===cls) n++;});return n;})};
  });
  // referência de largura das colunas
  plotGuard(el,traces,{barmode:'stack',xaxis:{automargin:true,tickangle:0},yaxis:{automargin:true},bargap:.18});
}

function renderSprintTech(rows){
  var el=document.getElementById('chartSprintTech'); if(!el) return;
  var techs=[...new Set(rows.map(function(r){return friendly(r['TECHNOLOGY'])||'N/D';}))].sort();
  var totalBySprint={};
  rows.forEach(function(r){ var sp=friendly(r['SPRINT'])||'N/D'; totalBySprint[sp]=(totalBySprint[sp]||0)+1; });
  var sprints=Object.keys(totalBySprint).sort(function(a,b){return totalBySprint[b]-totalBySprint[a];});
  var traces=sprints.map(function(sp){
    return {type:'bar',name:sp,x:techs,y:techs.map(function(t){
      var n=0; rows.forEach(function(r){ if((friendly(r['TECHNOLOGY'])||'N/D')===t && (friendly(r['SPRINT'])||'N/D')===sp) n++; }); return n;
    })};
  });
  // barras mais largas + eixo x horizontal
  plotGuard(
    el,
    traces,
    { barmode:'stack', xaxis:{automargin:true, tickangle:0}, yaxis:{automargin:true}, bargap:.10 }
  );
}

function renderHeatVT(rows){
  var el=document.getElementById('chartHeatVT'); if(!el) return;
  var vendors=[...new Set(rows.map(function(r){return friendly(r['VENDOR'])||'N/D';}))].sort();
  var techs=[...new Set(rows.map(function(r){return friendly(r['TECHNOLOGY'])||'N/D';}))].sort();
  var z=vendors.map(function(v){return techs.map(function(t){var n=0; rows.forEach(function(r){ if((friendly(r['VENDOR'])||'N/D')===v && (friendly(r['TECHNOLOGY'])||'N/D')===t) n++;}); return n;});});
  var hm={type:'heatmap',z:z,x:techs,y:vendors,colorbar:{title:'Qtd'}};
  plotGuard(el,[hm],{margin:{t:30,b:40,l:80,r:16}});
}

function renderRadar(rows){
  var el=document.getElementById('chartRadar'); if(!el) return;
  var vendors=[...new Set(rows.map(function(r){return friendly(r['VENDOR'])||'N/D';}))].sort();
  var classes=[...new Set(rows.map(function(r){return friendly(r['PARAMETER CLASS'])||'N/D';}))].sort();
  var traces=vendors.map(function(v){
    return {type:'scatterpolar',name:v,theta:classes,
            r:classes.map(function(c){var n=0; rows.forEach(function(r){ if((friendly(r['VENDOR'])||'N/D')===v && (friendly(r['PARAMETER CLASS'])||'N/D')===c) n++;}); return n; }),
            fill:'toself'};
  });
  plotGuard(
    el,
    traces,
    {
      polar:{radialaxis:{visible:true}},
      legend:{orientation:'h', y:-0.28, x:0.5, xanchor:'center', font:{size:11}},
      margin:{t:36,b:110,l:50,r:16}
    }
  );
}

/* ===== Tabela ===== */
function renderTable(rows){
  var el=document.getElementById('grid');
  var thead='<thead><tr>'+COLS.map(function(c,i){
      return '<th data-col="'+i+'"><span class="clip">'+esc(c)+'</span><div class="col-resizer" data-resizer="'+i+'"></div></th>';
    }).join('')+'</tr></thead>';
  var tbody='<tbody>'+rows.map(function(r){
    return '<tr>'+COLS.map(function(c){
      var v=r[c]||''; return '<td><span class="clip" data-full="'+esc(v)+'">'+esc(v)+'</span></td>';
    }).join('')+'</tr>';
  }).join('')+'</tbody>';
  el.innerHTML = thead + tbody;

  // Mantém largura atual inicial e ativa redimensionamento
  lockInitialColumnWidths(el);
  enableColumnResize(el);
}

/* ===== Column Resize Helpers ===== */
function lockInitialColumnWidths(tableEl){
  try{
    var ths = tableEl.querySelectorAll('thead th');
    ths.forEach(function(th, idx){
      var w = th.getBoundingClientRect().width;
      if(w>0){
        th.style.width = w+'px';
        th.style.minWidth = w+'px';
        // aplica nas células da coluna
        var rows = tableEl.querySelectorAll('tbody tr');
        rows.forEach(function(tr){
          var td = tr.children[idx];
          if(td){ td.style.width=w+'px'; td.style.minWidth=w+'px'; }
        });
      }
    });
  }catch(e){ console.warn('width lock fail:', e); }
}

function enableColumnResize(tableEl){
  var startX, startW, colIdx, shadow;
  function onDown(e){
    var handle = e.target.closest('.col-resizer'); if(!handle) return;
    e.preventDefault();
    colIdx = parseInt(handle.getAttribute('data-resizer'),10);
    var th = tableEl.querySelector('thead th[data-col="'+colIdx+'"]');
    startW = th.getBoundingClientRect().width;
    startX = e.clientX;

    shadow = document.createElement('div');
    shadow.style.position='fixed'; shadow.style.top='0'; shadow.style.left='0';
    shadow.style.right='0'; shadow.style.bottom='0'; shadow.style.cursor='col-resize';
    shadow.style.zIndex='9999'; shadow.style.background='rgba(0,0,0,0)';
    document.body.appendChild(shadow);

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }
  function onMove(e){
    if(colIdx==null) return;
    var dx = e.clientX - startX;
    var newW = Math.max(60, Math.round(startW + dx)); // largura mínima
    var th = tableEl.querySelector('thead th[data-col="'+colIdx+'"]');
    th.style.width = newW+'px'; th.style.minWidth = newW+'px';
    var rows = tableEl.querySelectorAll('tbody tr');
    rows.forEach(function(tr){
      var td = tr.children[colIdx];
      if(td){ td.style.width=newW+'px'; td.style.minWidth=newW+'px'; }
    });
  }
  function onUp(){
    colIdx=null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if(shadow){ shadow.remove(); shadow=null; }
  }
  tableEl.addEventListener('mousedown', onDown);
}

/* ===== Tooltip ===== */
let tooltipDiv = null;
let tooltipTimer = null;
function createTooltip() { if (tooltipDiv) return; tooltipDiv = document.createElement('div'); tooltipDiv.id = 'tooltip'; document.body.appendChild(tooltipDiv); }
function showTooltip(target) {
  if (!target || !target.hasAttribute('data-full')) return;
  clearTimeout(tooltipTimer); createTooltip();
  tooltipTimer = setTimeout(() => {
    const fullText = target.getAttribute('data-full');
    tooltipDiv.textContent = fullText; tooltipDiv.style.display = 'block';
    const rect = target.getBoundingClientRect();
    tooltipDiv.style.left = rect.left + 'px'; tooltipDiv.style.top = rect.top + 'px';
    tooltipDiv.style.transform = 'translateY(-120%)'; tooltipDiv.style.opacity = '1';
    const r = tooltipDiv.getBoundingClientRect();
    if (r.left < 0) tooltipDiv.style.left = '5px';
    if (r.right > window.innerWidth) tooltipDiv.style.left = (window.innerWidth - r.width - 5) + 'px';
    if (r.top < 0) { tooltipDiv.style.top = (rect.bottom + 5) + 'px'; tooltipDiv.style.transform = 'translateY(0)'; }
  }, 200);
}
function hideTooltip() { clearTimeout(tooltipTimer); if (tooltipDiv) { tooltipDiv.style.opacity = '0'; setTimeout(() => { tooltipDiv.style.display = 'none'; }, 200); } }
document.addEventListener('mouseover', (e) => { const t = e.target.closest('.clip'); if (t) showTooltip(t); });
document.addEventListener('mouseout', (e) => { const rt = e.relatedTarget ? e.relatedTarget.closest('.clip') : null; if (!rt) hideTooltip(); });
document.addEventListener('scroll', () => { hideTooltip(); }, true);

/* ===== Render ===== */
function renderAll(){
  VIEW=applyFilters();
  renderKPIs(VIEW);
  renderVendor(VIEW);
  renderTech(VIEW);
  renderClassTech(VIEW);
  renderSprintTech(VIEW);
  renderHeatVT(VIEW);
  renderRadar(VIEW);
  renderTable(VIEW);
}
function buildFilters(){
  fillSelect('fVendor', RAW.map(function(r){return r['VENDOR'];}));
  fillSelect('fTech',    RAW.map(function(r){return r['TECHNOLOGY'];}));
  fillSelect('fClass',   RAW.map(function(r){return r['PARAMETER CLASS'];}));
  fillSelect('fSprint',  RAW.map(function(r){return r['SPRINT'];}));
  fillSelect('fFunc',    RAW.map(function(r){return r['FUNÇÃO'];}));
}
function resetFilters(){
  FILTERS={vendor:[],tech:[],cls:[],sprint:[],func:[],search:''};
  ['fVendor','fTech','fClass','fSprint','fFunc'].forEach(function(id){
    var sel=document.getElementById(id); if(!sel) return;
    [].slice.call(sel.options).forEach(function(o){o.selected=false;});
  });
  var s=document.getElementById('fSearch'); if(s) s.value='';
  renderAll();
}

/* Expor handlers */
window.onFilterChanged = onFilterChanged;
window.resetFilters    = resetFilters;
